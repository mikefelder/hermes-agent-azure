# Home Assistant Voice PE firmware, talking directly to the Hermes voice sidecar
# (no Home Assistant). Secrets live in secrets.yaml (gitignored).
substitutions:
  name: hermes-voice
  friendly_name: Hermes Voice

packages:
  voice_pe: github://esphome/home-assistant-voice-pe/home-assistant-voice.yaml@26.9.0

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

api:
  encryption:
    key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
