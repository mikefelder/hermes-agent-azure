<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Voice</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="importmap">{ "imports": { "three": "/static/vendor/three.module.min.js" } }</script>
</head>
<body>
  <main id="stage">
    <div id="face3d" aria-hidden="true"></div>
    <canvas id="face" aria-label="Character face"></canvas>
    <div id="hud" aria-hidden="true">
      <div class="hud-corner tl"><span class="rec"></span>LINK · ERID-1 <em>↔</em> HAIL MARY</div>
      <div class="hud-corner tr"><span id="hud-clock">00:00:00</span><span class="sig"><i></i><i></i><i></i><i></i><i></i></span></div>
      <div class="hud-corner bl">XLAT · ERIDIAN→EN <span id="hud-state">IDLE</span></div>
      <div class="hud-corner br">FREQ <span id="hud-freq">0000</span> Hz · Δt <span id="hud-lag">0</span> ms</div>
      <div class="hud-frame"></div>
      <div class="hud-scan"></div>
    </div>
    <div id="status" role="status" aria-live="polite">connecting…</div>
    <div id="caption" aria-live="polite"></div>
  </main>

  <header id="topbar">
    <div class="persona-switch" role="radiogroup" aria-label="Persona">
      <button type="button" data-persona="rocky" role="radio" aria-checked="true">Rocky</button>
      <button type="button" data-persona="tars" role="radio" aria-checked="false">TARS</button>
    </div>
    <div class="spacer"></div>
    <button type="button" id="btn-transcript" aria-expanded="false">Transcript</button>
    <button type="button" id="btn-debug" aria-expanded="false" title="Toggle metrics (D)">Metrics</button>
  </header>

  <footer id="controls">
    <button type="button" id="btn-talk" aria-label="Hold to talk">
      <span class="dot"></span><span class="label">Hold to talk</span>
    </button>
    <form id="text-form" autocomplete="off">
      <input id="text-input" type="text" maxlength="2000" placeholder="…or type here" aria-label="Message">
      <button type="submit">Send</button>
    </form>
    <button type="button" id="btn-stop" title="Stop (Esc)">Stop</button>
  </footer>

  <aside id="transcript" hidden>
    <h2>Transcript</h2>
    <ol id="transcript-list"></ol>
  </aside>

  <aside id="debug" hidden>
    <h2>Metrics</h2>
    <dl id="metrics"></dl>
    <ol id="events"></ol>
  </aside>

  <script src="/static/faces.js"></script>
  <script src="/static/app.js"></script>
  <script type="module" src="/static/rocky3d.js"></script>
</body>
</html>
